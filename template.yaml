port: 7890
socks-port: 7891
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
unified-delay: true

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🎯 全球直连

  - name: 🤖 人工智能
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🎯 全球直连

  - name: 🍎 苹果服务
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择

  - name: 🪟 微软服务
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT

  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

rules:
  # 1. 局域网与本地网络
  - GEOIP,lan,🎯 全球直连,no-resolve
  - GEOIP,private,🎯 全球直连,no-resolve
  - DST-PORT,53,🎯 全球直连
  - DST-PORT,123,🎯 全球直连

  # 2. 广告拦截
  - GEOSITE,category-ads-all,🛑 广告拦截

  # 3. AI / ChatGPT / Gemini 专属高优先级规则
  - DOMAIN-SUFFIX,chatgpt.com,🤖 人工智能
  - DOMAIN-SUFFIX,openai.com,🤖 人工智能
  - DOMAIN-SUFFIX,oaistatic.com,🤖 人工智能
  - DOMAIN-SUFFIX,oaiusercontent.com,🤖 人工智能
  - DOMAIN-KEYWORD,openai,🤖 人工智能
  - DOMAIN-SUFFIX,gemini.google.com,🤖 人工智能
  - DOMAIN-SUFFIX,proactivebackend-pa.googleapis.com,🤖 人工智能
  - DOMAIN-SUFFIX,bard.google.com,🤖 人工智能
  - DOMAIN-SUFFIX,claude.ai,🤖 人工智能
  - DOMAIN-SUFFIX,anthropic.com,🤖 人工智能
  - GEOSITE,openai,🤖 人工智能

  # 4. 苹果服务规则
  - GEOSITE,apple,🍎 苹果服务
  - DOMAIN-SUFFIX,apple.com,🍎 苹果服务
  - DOMAIN-SUFFIX,icloud.com,🍎 苹果服务
  - DOMAIN-SUFFIX,itunes.com,🍎 苹果服务
  - DOMAIN-SUFFIX,mzstatic.com,🍎 苹果服务

  # 5. 微软服务规则
  - DOMAIN-SUFFIX,copilot.microsoft.com,🤖 人工智能
  - GEOSITE,microsoft,🪟 微软服务
  - DOMAIN-SUFFIX,microsoft.com,🪟 微软服务
  - DOMAIN-SUFFIX,live.com,🪟 微软服务
  - DOMAIN-SUFFIX,office.com,🪟 微软服务
  - DOMAIN-SUFFIX,bing.com,🪟 微软服务

  # 6. 国外常用媒体与网站
  - GEOSITE,telegram,🚀 节点选择
  - GEOSITE,youtube,🚀 节点选择
  - GEOSITE,google,🚀 节点选择
  - GEOSITE,github,🚀 节点选择
  - GEOSITE,twitter,🚀 节点选择
  - GEOSITE,geolocation-!cn,🚀 节点选择

  # 7. 国内服务直连
  - GEOSITE,cn,🎯 全球直连
  - GEOSITE,bilibili,🎯 全球直连
  - GEOSITE,tencent,🎯 全球直连
  - GEOSITE,alibaba,🎯 全球直连
  - GEOSITE,baidu,🎯 全球直连
  - GEOIP,cn,🎯 全球直连

  # 8. 漏网之鱼走代理
  - MATCH,🐟 漏网之鱼
