name: Generate Clash Meta Config

on:
  schedule:
    # 每天北京时间 08:00 和 20:00 各自动执行一次
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download & Clean Node Links
        run: |
          mkdir -p raw_data
          # 1. 宿主机直接下载原始文件（使用真实 '+' 规避转义错误）
          curl -sSL "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS+All_RUS.txt" -o raw_data/1.txt
          curl -sSL "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt" -o raw_data/2.txt
          curl -sSL "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt" -o raw_data/3.txt

          # 2. 清洗数据：合并、去空行、去注释、提取合法的代理协议行
          cat raw_data/*.txt | grep -E '^(vless|hysteria2|vmess|trojan|ss)://' | sort -u > all_nodes.txt
          
          echo "清洗后的有效节点总数："
          wc -l all_nodes.txt

          # 3. 转换为 Base64 订阅格式（Subconverter 最稳定支持的格式）
          base64 -w 0 all_nodes.txt > nodes_b64.txt

      - name: Start Local Services
        run: |
          # 启动本地 HTTP 文件服务供容器读取
          python3 -m http.server 8080 &
          
          # 使用 --network host 启动 subconverter，以便直接访问宿主机的 8080 端口
          docker run -d --name subconv --network host tindy2013/subconverter:latest
          sleep 4

      - name: Convert to Clash.Meta
        run: |
          # 请求本地 subconverter 进行转换
          curl -s "http://127.0.0.1:25500/sub?target=clash&new_name=true&url=http://127.0.0.1:8080/nodes_b64.txt" -o raw_clash.yaml

          # 输出前 20 行日志用于检查，避免静默失败
          echo "=== Subconverter 转换结果预览 ==="
          head -n 20 raw_clash.yaml

          # 校验是否包含 proxies
          if ! grep -q "proxies:" raw_clash.yaml; then
            echo "错误：Subconverter 未能输出有效节点，请检查上方日志！"
            exit 1
          fi

      - name: Merge with Custom Template & Rules
        run: |
          python3 - << 'EOF'
          import yaml

          # 1. 读取转换出来的节点
          with open('raw_clash.yaml', 'r', encoding='utf-8') as f:
              raw_data = yaml.safe_load(f)
          proxies = raw_data.get('proxies', [])
          
          if not proxies:
              raise ValueError("没有提取到任何有效节点！")

          # 2. 处理重名节点，获取名称列表
          proxy_names = []
          for idx, p in enumerate(proxies):
              # 如果有同名节点，加序号防止 Clash 报错
              if p['name'] in proxy_names:
                  p['name'] = f"{p['name']}_{idx+1}"
              proxy_names.append(p['name'])

          # 3. 读取用户自定义的规则模板
          with open('template.yaml', 'r', encoding='utf-8') as f:
              template_data = yaml.safe_load(f)

          # 4. 将节点注入模板
          template_data['proxies'] = proxies

          # 5. 注入到对应策略组
          for group in template_data.get('proxy-groups', []):
              if group['name'] in ['🚀 节点选择', '♻️ 自动选择']:
                  group['proxies'].extend(proxy_names)

          # 6. 生成最终文件
          with open('clash_config.yaml', 'w', encoding='utf-8') as f:
              yaml.dump(template_data, f, allow_unicode=True, sort_keys=False)

          print(f"合并完成！共注入 {len(proxies)} 个有效节点。")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clash_config.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update Clash Config: $(date '+%Y-%m-%d %H:%M:%S')" && git push)
