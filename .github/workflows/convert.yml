name: Generate Clash Meta Config

on:
  schedule:
    # 每 4 个小时自动执行一次（北京时间 00:00, 04:00, 08:00, 12:00, 16:00, 20:00）
    - cron: '0 */4 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Raw Nodes
        run: |
          mkdir -p raw_data
          # 使用 -f 选项：遇到 404/500 强制报错，避免下载到空内容或错误页面
          # 同时对带有 + 号的文件做双重兜底下载
          curl -sSLf "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS%2BAll_RUS.txt" -o raw_data/1.txt || \
          curl -sSLf "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS+All_RUS.txt" -o raw_data/1.txt
          
          curl -sSLf "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt" -o raw_data/2.txt
          curl -sSLf "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt" -o raw_data/3.txt

          echo "=== 检查每个下载文件的体积与行数 ==="
          ls -lh raw_data/
          wc -l raw_data/*.txt

      - name: Parse Nodes and Generate Clash.Meta Config
        run: |
          python3 - << 'EOF'
          import json
          import base64
          import urllib.parse
          import yaml
          import glob
          import re
          import sys

          def safe_b64decode(s):
              s = s.strip()
              missing_padding = len(s) % 4
              if missing_padding:
                  s += '=' * (4 - missing_padding)
              return base64.b64decode(s).decode('utf-8', errors='ignore')

          def parse_vless(url):
              u = urllib.parse.urlparse(url)
              query = dict(urllib.parse.parse_qsl(u.query))
              port = int(u.port) if u.port else 443
              name = urllib.parse.unquote(u.fragment) if u.fragment else f"Vless_{u.hostname}_{port}"
              
              node = {
                  'name': name.strip(),
                  'type': 'vless',
                  'server': u.hostname,
                  'port': port,
                  'uuid': u.username,
                  'cipher': 'zero',
                  'udp': True
              }
              if 'flow' in query:
                  node['flow'] = query['flow']
                  
              sec = query.get('security', '')
              if sec == 'reality':
                  node['tls'] = True
                  reality_opts = {}
                  if 'pbk' in query: reality_opts['public-key'] = query['pbk']
                  if 'sid' in query: reality_opts['short-id'] = query['sid']
                  if 'spx' in query: reality_opts['spider-x'] = query['spx']
                  node['reality-opts'] = reality_opts
              elif sec == 'tls':
                  node['tls'] = True

              if 'sni' in query: node['servername'] = query['sni']
              if 'fp' in query: node['client-fingerprint'] = query['fp']

              net = query.get('type', 'tcp')
              if net == 'ws':
                  node['network'] = 'ws'
                  ws_opts = {}
                  if 'path' in query: ws_opts['path'] = query['path']
                  if 'host' in query: ws_opts['headers'] = {'Host': query['host']}
                  node['ws-opts'] = ws_opts
              elif net == 'grpc':
                  node['network'] = 'grpc'
                  grpc_opts = {}
                  if 'serviceName' in query: grpc_opts['grpc-service-name'] = query['serviceName']
                  node['grpc-opts'] = grpc_opts
              elif net in ['xhttp', 'splithttp']:
                  node['network'] = 'xhttp'
                  xhttp_opts = {}
                  if 'path' in query: xhttp_opts['path'] = query['path']
                  if 'host' in query: xhttp_opts['headers'] = {'Host': query['host']}
                  node['xhttp-opts'] = xhttp_opts

              return node

          def parse_hysteria2(url):
              u = urllib.parse.urlparse(url)
              query = dict(urllib.parse.parse_qsl(u.query))
              port = int(u.port) if u.port else 443
              name = urllib.parse.unquote(u.fragment) if u.fragment else f"Hy2_{u.hostname}_{port}"
              
              node = {
                  'name': name.strip(),
                  'type': 'hysteria2',
                  'server': u.hostname,
                  'port': port,
                  'password': u.username,
                  'udp': True
              }
              if 'sni' in query: node['sni'] = query['sni']
              if query.get('insecure') == '1' or query.get('allowInsecure') == '1':
                  node['skip-cert-verify'] = True
              return node

          def parse_trojan(url):
              u = urllib.parse.urlparse(url)
              query = dict(urllib.parse.parse_qsl(u.query))
              port = int(u.port) if u.port else 443
              name = urllib.parse.unquote(u.fragment) if u.fragment else f"Trojan_{u.hostname}_{port}"
              
              node = {
                  'name': name.strip(),
                  'type': 'trojan',
                  'server': u.hostname,
                  'port': port,
                  'password': u.username,
                  'udp': True
              }
              if 'sni' in query: node['sni'] = query['sni']
              if query.get('allowInsecure') == '1' or query.get('insecure') == '1':
                  node['skip-cert-verify'] = True
              if 'fp' in query: node['client-fingerprint'] = query['fp']
              return node

          def parse_vmess(url):
              raw_json = safe_b64decode(url[8:])
              data = json.loads(raw_json)
              port = int(data['port']) if data.get('port') else 443
              name = data.get('ps', f"Vmess_{data.get('add')}_{port}")
              
              node = {
                  'name': name.strip(),
                  'type': 'vmess',
                  'server': data['add'],
                  'port': port,
                  'uuid': data['id'],
                  'alterId': int(data.get('aid', 0)),
                  'cipher': data.get('scy', 'auto'),
                  'udp': True
              }
              if data.get('tls') == 'tls':
                  node['tls'] = True
              if data.get('sni'):
                  node['servername'] = data['sni']
                  
              net = data.get('net', 'tcp')
              if net == 'ws':
                  node['network'] = 'ws'
                  ws_opts = {}
                  if data.get('path'): ws_opts['path'] = data['path']
                  if data.get('host'): ws_opts['headers'] = {'Host': data['host']}
                  node['ws-opts'] = ws_opts
              return node

          # 1. 提取所有节点并统计
          all_lines = set()
          file_count = 0
          for file_path in sorted(glob.glob('raw_data/*.txt')):
              file_count += 1
              lines_in_file = 0
              with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith('#'):
                          all_lines.add(line)
                          lines_in_file += 1
              print(f"- 文件 {file_path} 读入有效链接行数: {lines_in_file}")

          print(f"合并去重后的唯一链接总数: {len(all_lines)}")

          proxies = []
          failed_lines = []
          for line in all_lines:
              try:
                  if line.startswith('vless://'):
                      proxies.append(parse_vless(line))
                  elif line.startswith('hysteria2://'):
                      proxies.append(parse_hysteria2(line))
                  elif line.startswith('trojan://'):
                      proxies.append(parse_trojan(line))
                  elif line.startswith('vmess://'):
                      proxies.append(parse_vmess(line))
              except Exception as e:
                  failed_lines.append((line[:60], str(e)))

          if failed_lines:
              print(f"⚠️ 解析失败的链接数: {len(failed_lines)}")
              for fail in failed_lines[:5]:
                  print(f"  失败示例: {fail[0]}... 原因: {fail[1]}")

          if not proxies:
              raise ValueError("未能解析出任何有效节点！")

          # 2. 节点重名去重处理
          unique_names = set()
          proxy_names = []
          for p in proxies:
              base_name = p['name']
              new_name = base_name
              count = 1
              while new_name in unique_names:
                  count += 1
                  new_name = f"{base_name} {count}"
              p['name'] = new_name
              unique_names.add(new_name)
              proxy_names.append(new_name)

          # 3. 读取 template.yaml 并清洗特殊字符
          with open('template.yaml', 'r', encoding='utf-8', errors='ignore') as f:
              raw_template_text = f.read()
          
          clean_template_text = re.sub(r'[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]', '', raw_template_text)
          template_data = yaml.safe_load(clean_template_text)

          template_data['proxies'] = proxies

          # 为对应策略组填充节点
          target_groups = ['🚀 节点选择', '♻️ 自动选择', '🤖 人工智能', '🍎 苹果服务', '🪟 微软服务']
          for group in template_data.get('proxy-groups', []):
              if group['name'] in target_groups:
                  group['proxies'].extend(proxy_names)

          # 4. 生成最终配置文件
          with open('clash_config.yaml', 'w', encoding='utf-8') as f:
              yaml.dump(template_data, f, allow_unicode=True, sort_keys=False)

          stats = {}
          for p in proxies:
              stats[p['type']] = stats.get(p['type'], 0) + 1

          print("\n=== 最终节点分类统计 ===")
          print(f"总计注入节点数: {len(proxies)}")
          for k, v in sorted(stats.items()):
              print(f"- {k.upper()}: {v} 个")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clash_config.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update Clash Meta Config: $(date '+%Y-%m-%d %H:%M:%S')" && git push)
