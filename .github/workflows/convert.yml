name: Generate Clash Meta Config

on:
  schedule:
    # 每天北京时间 08:00 和 20:00 各自动执行一次
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支持手动点击 Run workflow 触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download & Clean Node Links
        run: |
          mkdir -p raw_data
          # 1. 宿主机直接下载 3 个原始文件
          curl -sSL "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_SS+All_RUS.txt" -o raw_data/1.txt
          curl -sSL "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt" -o raw_data/2.txt
          curl -sSL "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt" -o raw_data/3.txt

          # 2. 清洗数据：提取合法的代理协议行并去重
          cat raw_data/*.txt | grep -E '^(vless|hysteria2|vmess|trojan|ss)://' | sort -u > all_nodes.txt
          
          echo "=== 清洗去重后的有效链接总数 ==="
          wc -l all_nodes.txt

          # 3. 转换为 Base64 订阅格式传递给转换器
          base64 -w 0 all_nodes.txt > nodes_b64.txt

      - name: Start Local Services
        run: |
          # 启动本地 HTTP 服务供容器读取
          python3 -m http.server 8080 &
          
          # 启动 Subconverter 容器
          docker run -d --name subconv --network host tindy2013/subconverter:latest
          sleep 4

      - name: Convert to Clash.Meta
        run: |
          # 关键参数：加上 clash.meta=true 和 ver=4，强制转换器保留 VLESS-Reality 节点
          curl -s "http://127.0.0.1:25500/sub?target=clash&clash.meta=true&ver=4&new_name=true&url=http://127.0.0.1:8080/nodes_b64.txt" -o raw_clash.yaml

          # 输出日志，用于确认 VLESS 节点是否已成功导出
          echo "=== 检查 VLESS 节点保留情况 ==="
          if grep -q "type: vless" raw_clash.yaml; then
            echo "✅ 成功提取到 VLESS-Reality 节点！"
          else
            echo "⚠️ 警告：未检测到 VLESS 节点，请检查节点源！"
          fi

          if ! grep -q "proxies:" raw_clash.yaml; then
            echo "错误：未能输出任何节点！"
            cat raw_clash.yaml
            exit 1
          fi

      - name: Merge with Custom Template & Rules
        run: |
          python3 - << 'EOF'
          import yaml

          # 1. 读取转换出来的节点
          with open('raw_clash.yaml', 'r', encoding='utf-8') as f:
              raw_data = yaml.safe_load(f)
          proxies = raw_data.get('proxies', [])
          
          if not proxies:
              raise ValueError("没有提取到任何有效节点！")

          # 2. 节点去重和重命名（防止同名节点导致客户端加载失败）
          proxy_names = []
          for idx, p in enumerate(proxies):
              base_name = p['name']
              new_name = base_name
              count = 1
              while new_name in proxy_names:
                  count += 1
                  new_name = f"{base_name} {count}"
              p['name'] = new_name
              proxy_names.append(new_name)

          # 3. 读取自定义规则模板
          with open('template.yaml', 'r', encoding='utf-8') as f:
              template_data = yaml.safe_load(f)

          # 4. 将节点注入模板
          template_data['proxies'] = proxies

          # 5. 注入到对应策略组中
          for group in template_data.get('proxy-groups', []):
              if group['name'] in ['🚀 节点选择', '♻️ 自动选择']:
                  group['proxies'].extend(proxy_names)

          # 6. 生成最终的 Clash.Meta 配置文件
          with open('clash_config.yaml', 'w', encoding='utf-8') as f:
              yaml.dump(template_data, f, allow_unicode=True, sort_keys=False)

          # 统计各类协议数量
          vless_count = sum(1 for p in proxies if p.get('type') == 'vless')
          hy2_count = sum(1 for p in proxies if p.get('type') == 'hysteria2')
          vmess_count = sum(1 for p in proxies if p.get('type') == 'vmess')
          trojan_count = sum(1 for p in proxies if p.get('type') == 'trojan')

          print(f"=== 合并统计 ===")
          print(f"总节点数: {len(proxies)}")
          print(f"VLESS 节点: {vless_count}")
          print(f"Hysteria2 节点: {hy2_count}")
          print(f"VMess 节点: {vmess_count}")
          print(f"Trojan 节点: {trojan_count}")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clash_config.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update Clash Meta Config: $(date '+%Y-%m-%d %H:%M:%S')" && git push)
